# 复制本文件为 secrets.yaml，填好后再运行。
# secrets.yaml 里的同名字段会覆盖 config.yaml，不要把 secrets.yaml 发给别人。

openalex:
  api_key: ""          # https://openalex.org/settings/api 免费申请，每天 $1 额度

search:
  email: ""            # 你的邮箱，OpenAlex/Crossref 礼貌池用

translation:
  # backend 可选：auto / youdao / mymemory / deepseek / zhipu / baidu / none
  # auto 不需要任何 key（有道 → MyMemory 免费通道）
  backend: deepseek
  deepseek:
    api_key: ""        # https://platform.deepseek.com 充值 10 元够用很久
    model: deepseek-chat
  zhipu:
    api_key: ""        # https://open.bigmodel.cn 有免费额度
    model: glm-4-flash
  baidu:
    appid: ""
    secret: ""

email:
  enabled: false
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  user: "你的QQ邮箱@qq.com"
  password: "邮箱授权码，不是登录密码"
  to: ["收件邮箱@example.com"]

# 校园网门户账号（名字要和 config.yaml 里 portal.sites[].name 一致）
# 推荐使用 run_gui.bat 输入密码，由 GUI 通过 Windows DPAPI 加密保存。
# 若手动填入本文件，密码会以明文保存在本机，请勿分享或提交 secrets.yaml。
# 配好后把 config.yaml 的 portal.auto_login 改成 true
portal_credentials:
  校园网:
    username: ""
    password: ""
  期刊数据库:
    username: ""
    password: ""
